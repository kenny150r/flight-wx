<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flight-wx — flight vs NEXRAD report</title>
  <meta name="description" content="In-browser report of maximum reflectivity, radar radial velocity, and shear along a flight track.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='none' stroke='%233ee0b2' stroke-width='4'/><path d='M18 62 L82 38' stroke='%23f0b429' stroke-width='4'/></svg>">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <circle cx="20" cy="20" r="16" stroke="#3ee0b2" stroke-width="1.6" opacity="0.5"/>
        <circle cx="20" cy="20" r="8" stroke="#3ee0b2" stroke-width="1.6"/>
        <path d="M8 26 L33 14" stroke="#f0b429" stroke-width="2"/>
      </svg>
      <h1>flight-wx</h1>
    </div>
    <p class="tagline">Flight number + date → max dBZ, radar radial velocity, and shear along the path. Runs entirely in the browser.</p>

    <form id="analyze-form">
      <div class="row">
        <label>Flight
          <input id="flight" name="flight" type="text" placeholder="EDV4985, 9E4985, or DL4985" autocomplete="off">
        </label>
        <label>Date (UTC)
          <input id="date" name="date" type="date">
        </label>
      </div>
      <label>Mode-S hex (optional, helps historical traces)
        <input id="hex" name="hex" type="text" placeholder="a1b2c3" autocomplete="off">
      </label>
      <label>Or upload a track (CSV / GeoJSON)
        <input id="track-file" name="track" type="file" accept=".csv,.json,.geojson,text/csv,application/json">
      </label>
      <button type="submit">Analyze flight</button>
      <button type="button" id="example-flight" class="example">Try example: Endeavor 4985 · 17 Jul 2025 (JFK–CVG)</button>
    </form>

    <div id="status" class="status" hidden></div>
    <div id="progress" class="progress" hidden>
      <div id="progress-text">Working…</div>
      <div class="progress-bar"><span id="progress-bar"></span></div>
      <div id="progress-detail" class="progress-detail"></div>
    </div>

    <section id="report" class="report" hidden>
      <div class="cards">
        <article class="card" data-card="dbz">
          <h3>Max reflectivity</h3>
          <div><span class="metric-value">—</span><span class="metric-unit">dBZ</span></div>
          <div class="metric-sub"></div>
          <div class="metric-meta"></div>
        </article>
        <article class="card" data-card="vel">
          <h3>Max |radial velocity|</h3>
          <div><span class="metric-value">—</span><span class="metric-unit">kt</span></div>
          <div class="metric-sub"></div>
          <div class="metric-meta"></div>
        </article>
        <article class="card" data-card="shear">
          <h3>Max radar shear</h3>
          <div><span class="metric-value">—</span><span class="metric-unit">kt/km</span></div>
          <div class="metric-sub"></div>
          <div class="metric-meta"></div>
        </article>
      </div>
      <div class="series" data-series="dbz"></div>
      <div class="series" data-series="vel"></div>
      <p class="notes" data-notes></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>UTC</th><th>Radar</th><th>dBZ</th><th>|Vr| kt</th><th>Rad s⁻¹</th><th>Az s⁻¹</th><th></th>
            </tr>
          </thead>
          <tbody data-table></tbody>
        </table>
      </div>
    </section>
  </aside>

  <main class="stage">
    <div id="map"></div>
    <div id="radar-hud" class="radar-hud" hidden>
      <div data-hud-title>Radar</div>
      <div class="hud-actions">
        <button type="button" data-product="reflectivity">Reflectivity</button>
        <button type="button" data-product="velocity">Velocity</button>
        <button type="button" id="clear-radar" class="ghost">Clear</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
